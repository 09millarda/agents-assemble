services:
  migrate:
    build: .
    image: agents-assemble:local
    command: ["node", "dist/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://agents_assemble:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/agents_assemble
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-local-application-only}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: agents-assemble:local
    restart: unless-stopped
    init: true
    environment: &application_environment
      DATABASE_URL: postgresql://aa_control_plane:${APP_DATABASE_PASSWORD:-local-application-only}@postgres:5432/agents_assemble
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-self-hosted-agents-assemble}
      STATE_DIRECTORY: /data
      RUNNER_HOSTNAME: ${RUNNER_HOSTNAME:-localhost}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_OIDC_AUDIENCE: ${GITHUB_OIDC_AUDIENCE:-agents-assemble}
      PUBLICATION_POLICY: ${PUBLICATION_POLICY:-}
      INVITED_PUBLISHER_ORGANIZATIONS: ${INVITED_PUBLISHER_ORGANIZATIONS:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-}
    volumes:
      - control_plane_state:/data
    ports:
      - "127.0.0.1:3001:3001"
      - "3443:3443"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    image: agents-assemble:local
    command: ["node", "dist/worker.mjs"]
    restart: unless-stopped
    init: true
    environment: *application_environment
    volumes:
      - control_plane_state:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  control_plane_state:
