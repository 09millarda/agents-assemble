AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Agents Assemble reference HTTP service, exact versioned artifact and public health identity.
Parameters:
  CodeBucket:
    Type: String
    MinLength: 3
  CodeKey:
    Type: String
    MinLength: 1
  CodeVersion:
    Type: String
    MinLength: 1
  ArtifactDigest:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
Rules:
  SupportedRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', eu-west-1]
        AssertDescription: The reference delivery profile is qualified only for eu-west-1.
Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Handler: handler.handler
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref CodeKey
        Version: !Ref CodeVersion
      Environment:
        Variables:
          ARTIFACT_DIGEST: !Ref ArtifactDigest
      Policies:
        - Statement:
            - Effect: Allow
              Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
              Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
  HealthVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref HealthFunction
      Description: !Ref ArtifactDigest
  HealthAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref HealthFunction
      FunctionVersion: !GetAtt HealthVersion.Version
  HealthApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-health'
      ProtocolType: HTTP
  HealthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HealthApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref HealthAlias
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HealthApi
      RouteKey: GET /health
      Target: !Sub 'integrations/${HealthIntegration}'
  HealthStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HealthApi
      StageName: '$default'
      AutoDeploy: true
  HealthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HealthApi}/*/GET/health'

Outputs:
  HealthUrl:
    Value: !Sub '${HealthApi.ApiEndpoint}/health'
  FunctionName:
    Value: !Ref HealthFunction
  Version:
    Value: !GetAtt HealthVersion.Version
  FunctionVersion:
    Value: !GetAtt HealthVersion.Version
  VersionArn:
    Value: !Ref HealthVersion
  AliasArn:
    Value: !Ref HealthAlias
  ArtifactDigest:
    Value: !Ref ArtifactDigest
  AccountId:
    Value: !Ref AWS::AccountId
  StackName:
    Value: !Ref AWS::StackName
  Region:
    Value: !Ref AWS::Region
