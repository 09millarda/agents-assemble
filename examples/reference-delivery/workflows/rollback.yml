name: Agents Assemble exact reference rollback
run-name: Agents Assemble ${{ inputs.effect_id }}
on:
  workflow_dispatch:
    inputs:
      effect_id: {type: string, required: true}
      manifest_digest: {type: string, required: true}
      artifact_digest: {type: string, required: true}
      environment: {type: choice, options: [production], required: true}
      environment_revision: {type: string, required: true}
      policy_generation: {type: string, required: true}
permissions: {contents: read}
jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --prefix examples/reference-delivery
      - run: node examples/reference-delivery/scripts/workflow.ts deploy
        env:
          AA_SERVICE_URL: ${{ vars.AA_SERVICE_URL }}
          AA_ORGANIZATION_ID: ${{ vars.AA_ORGANIZATION_ID }}
          AA_DEPLOY_ROLE_ARN: ${{ vars.AA_DEPLOY_ROLE_ARN }}
