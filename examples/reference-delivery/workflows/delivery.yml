name: Agents Assemble reference delivery
run-name: Agents Assemble ${{ inputs.effect_id || inputs.delivery_id }}
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, options: [build, deploy], default: deploy}
      source_commit: {type: string, required: false}
      delivery_id: {type: string, required: false}
      effect_id: {type: string, required: false}
      manifest_digest: {type: string, required: false}
      artifact_digest: {type: string, required: false}
      environment: {type: choice, options: [staging, production], required: false}
      environment_revision: {type: string, required: false}
      policy_generation: {type: string, required: false}
permissions: {contents: read}
env:
  AA_SERVICE_URL: ${{ vars.AA_SERVICE_URL }}
  AA_ORGANIZATION_ID: ${{ vars.AA_ORGANIZATION_ID }}
  AA_REPOSITORY_ID: ${{ vars.AA_REPOSITORY_ID }}
jobs:
  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-24.04
    environment: aa-build
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --prefix examples/reference-delivery
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - run: node examples/reference-delivery/scripts/workflow.ts build
        env:
          AA_SOURCE_DIRECTORY: source
          AA_ARTIFACT_BUCKET: ${{ vars.AA_ARTIFACT_BUCKET }}
          AA_BUILD_ROLE_ARN: ${{ vars.AA_BUILD_ROLE_ARN }}
  deploy:
    if: inputs.mode != 'build'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --prefix examples/reference-delivery
      - run: node examples/reference-delivery/scripts/workflow.ts deploy
        env:
          AA_DEPLOY_ROLE_ARN: ${{ vars.AA_DEPLOY_ROLE_ARN }}
