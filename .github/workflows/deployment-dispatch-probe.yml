# Disposable identity-only probe for decision 15. No cloud authority.
name: Deployment dispatch identity probe (decision 15)
run-name: aa-wf15-dispatch-${{ inputs.effect_id }}-${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      effect_id:
        description: Disposable logical effect identifier
        required: true
        type: string
      nonce:
        description: Correlation nonce (not authority)
        required: true
        type: string
      manifest_sha256:
        description: Exact disposable manifest digest
        required: true
        type: string

permissions: {}

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record run identity without performing an effect
        env:
          EFFECT_ID: ${{ inputs.effect_id }}
          NONCE: ${{ inputs.nonce }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, re
          for key in ('EFFECT_ID', 'NONCE'):
              assert re.fullmatch(r'[a-zA-Z0-9-]{1,80}', os.environ[key])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['MANIFEST_SHA256'])
          keys = ('EFFECT_ID', 'NONCE', 'MANIFEST_SHA256', 'GITHUB_REPOSITORY',
                  'GITHUB_REPOSITORY_ID', 'GITHUB_SHA', 'GITHUB_REF',
                  'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')
          print('AA_DISPATCH_OBSERVATION=' + json.dumps({k: os.environ[k] for k in keys}, sort_keys=True))
          PY
