# Retired 2026-09-13 at the owner's request; see docs/research/deployment-local-bridge-closure.md.
name: Local deployment bridge (decision 15)
run-name: aa-wf15l-${{ inputs.effect_id }}
on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Temporary authenticated local gateway
        required: true
        type: string
      effect_id:
        description: Registered local effect
        required: true
        type: string
      manifest_digest:
        description: Registered exact manifest digest
        required: true
        type: string
      expect_denied:
        description: Negative authorization probe
        type: boolean
        default: false
permissions: {}
jobs:
  request:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      id-token: write
    steps:
      - name: Fetch pinned client without AWS credentials
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/aa-local-client"
          git -C "$RUNNER_TEMP/aa-local-client" remote add origin https://github.com/09millarda/agents-assemble.git
          git -C "$RUNNER_TEMP/aa-local-client" fetch --depth=1 origin 4219516a302199aa6e08689a66c3aa46cf6d0ebc
          git -C "$RUNNER_TEMP/aa-local-client" checkout --detach FETCH_HEAD
      - name: Authenticate, request registered effect and observe result
        env:
          BRIDGE_URL: ${{ inputs.bridge_url }}
          EFFECT_ID: ${{ inputs.effect_id }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          EXPECT_DENIED: ${{ inputs.expect_denied }}
        run: node "$RUNNER_TEMP/aa-local-client/experiments/local-deployment-bridge/client.mjs"
