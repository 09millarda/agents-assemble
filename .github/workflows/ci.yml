name: Core conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: docker compose up -d --wait
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reference service contracts and SAM template
        run: |
          npm ci --ignore-scripts --prefix examples/reference-delivery
          npm run typecheck --prefix examples/reference-delivery
          npm test --prefix examples/reference-delivery
          npm run build --prefix examples/reference-delivery
          pipx run --spec cfn-lint==1.56.3 cfn-lint examples/reference-delivery/template.yaml
      - run: npm run inventory && git diff --exit-code docs/distribution/dependencies.json
      - name: Browser acceptance against the real control plane
        env:
          DATABASE_URL: postgresql://agents_assemble:local-development-only@127.0.0.1:55433/agents_assemble
          STATE_DIRECTORY: .local/ci-control-plane
          AA_ADMIN_EMAIL: browser-ci@example.test
          AA_ADMIN_NAME: Browser CI
          AA_ORGANIZATION: Browser CI
          AA_ADMIN_PASSWORD: disposable-ci-password
          AA_BROWSER_EMAIL: browser-ci@example.test
          AA_BROWSER_PASSWORD: disposable-ci-password
        run: |
          npm run db:migrate
          npm run bootstrap
          npm run api > .local/ci-api.log 2>&1 &
          api_pid=$!
          npm run worker > .local/ci-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl --fail --silent http://127.0.0.1:3001/api/v1/health >/dev/null; do sleep 1; done'
          npm run test:browser
      - name: Contributor certification
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run dco
      - if: always()
        run: docker compose down
