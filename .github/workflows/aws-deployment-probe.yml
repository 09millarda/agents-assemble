name: AWS deployment probe (decision 15)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Disposable test environment
        type: choice
        options: [staging, prod]
        required: true
      candidate:
        description: Retained artifact to deploy
        type: choice
        options: [healthy, unhealthy, baseline]
        required: true
      expected_prior:
        description: Expected current Lambda ZIP SHA-256 (hex)
        type: string
        required: true

permissions: {}

concurrency:
  group: aa-wf15-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Fetch the reviewed disposable controller
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/aa-wf15-fixture"
          git -C "$RUNNER_TEMP/aa-wf15-fixture" remote add origin https://github.com/09millarda/agents-assemble.git
          git -C "$RUNNER_TEMP/aa-wf15-fixture" fetch --depth=1 origin 749b26f23900906e3dc15031d67c1ded7efdfd6a
          git -C "$RUNNER_TEMP/aa-wf15-fixture" checkout --detach FETCH_HEAD
      - name: Deploy and verify the retained artifact
        env:
          PROBE_ENV: ${{ inputs.environment }}
          PROBE_CANDIDATE: ${{ inputs.candidate }}
          EXPECTED_PRIOR: ${{ inputs.expected_prior }}
        run: |
          python3 "$RUNNER_TEMP/aa-wf15-fixture/experiments/lambda-deployment/release.py" \
            --environment "$PROBE_ENV" --candidate "$PROBE_CANDIDATE" --expected-prior "$EXPECTED_PRIOR"
