name: AWS identity check (decision 15)

on:
  workflow_dispatch:
    inputs:
      verify_aws:
        description: Assume the identity-only AWS role after CloudShell setup
        type: boolean
        default: false

permissions: {}

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Observe allowlisted claims and optionally verify AWS identity
        env:
          VERIFY_AWS: ${{ inputs.verify_aws }}
        shell: python
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          # Never emit the JWT, request token, or STS credentials.
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          fields = ('iss', 'aud', 'sub', 'repository', 'repository_id',
                    'repository_owner_id', 'ref', 'sha', 'workflow_ref',
                    'workflow_sha', 'run_id', 'run_attempt')
          print(json.dumps({key: claims.get(key) for key in fields}, indent=2), flush=True)
          # Decoding claims is observation, not signature verification. AWS verifies the JWT.
          if os.environ['VERIFY_AWS'] != 'true':
              raise SystemExit(0)
          data = urllib.parse.urlencode({
              'Action': 'AssumeRoleWithWebIdentity', 'Version': '2011-06-15',
              'RoleArn': 'arn:aws:iam::749771281623:role/aa-wf15-identity-check',
              'RoleSessionName': 'github-' + os.environ['GITHUB_RUN_ID'],
              'DurationSeconds': '900', 'WebIdentityToken': token}).encode()
          with urllib.request.urlopen('https://sts.eu-west-1.amazonaws.com/', data=data, timeout=30) as response:
              root = ET.fromstring(response.read())
          ns = {'s': 'https://sts.amazonaws.com/doc/2011-06-15/'}
          credentials = root.find('.//s:Credentials', ns)
          env = os.environ.copy()
          for field, variable in [('AccessKeyId', 'AWS_ACCESS_KEY_ID'),
                                  ('SecretAccessKey', 'AWS_SECRET_ACCESS_KEY'),
                                  ('SessionToken', 'AWS_SESSION_TOKEN')]:
              env[variable] = credentials.find('s:' + field, ns).text
          result = subprocess.run(['aws', 'sts', 'get-caller-identity', '--region',
                                   'eu-west-1', '--output', 'json', '--no-cli-pager'],
                                  env=env, capture_output=True, text=True, check=True)
          identity = json.loads(result.stdout)
          assert identity['Account'] == '749771281623', 'Unexpected AWS account'
          assert identity['Arn'].startswith('arn:aws:sts::749771281623:assumed-role/aa-wf15-identity-check/'), 'Unexpected role'
          print(json.dumps(identity, indent=2))
